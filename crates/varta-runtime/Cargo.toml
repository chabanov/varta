[package]
name = "varta-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varta-bigint = { path = "../varta-bigint" }
varta-common = { path = "../varta-common" }
thiserror.workspace = true
wasmtime.workspace = true
wasmparser.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
ureq.workspace = true
url.workspace = true
serde_json.workspace = true
ryu-js.workspace = true
getrandom.workspace = true
num-bigint.workspace = true

hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true
# The test-only hook produces v33 frame modules for runtime admission tests.
varta-compiler = { path = "../varta-compiler", features = ["suspension-test-hook"] }

[features]
# Test-only: run the runtime suites against the v38 code generator for every
# profile (`cargo test -p varta-runtime --features codegen-v2-all-profiles`).
codegen-v2-all-profiles = ["varta-compiler/codegen-v2-all-profiles"]

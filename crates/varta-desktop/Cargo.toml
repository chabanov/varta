[package]
name = "varta-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:vello_gpu", "dep:pollster"]
# The Linux fontconfig lookups of `--system-fonts` on another host, to test
# them against a local fontconfig (always built on Linux).
fontconfig = ["dep:fontconfig", "dep:skrifa"]

[[bin]]
name = "varta-preview"
path = "src/main.rs"

# The production native shell: a validated packaged artifact with its
# manifest grants, narrowed by an optional host ceiling.
[[bin]]
name = "varta-shell"
path = "src/bin/varta-shell.rs"

[[example]]
name = "gpu_probe"
required-features = ["gpu"]

[[example]]
name = "gpu_clip_probe"
required-features = ["gpu"]

[dependencies]
# Packaged artifacts are read and validated exactly as the launcher reads them.
varta-artifact = { path = "../varta-artifact" }
varta-common = { path = "../varta-common" }
varta-runtime = { path = "../varta-runtime" }
varta-view = { path = "../varta-view" }
# The style engine's font interface: the platform measures the fonts it
# renders with itself for the font-relative units.
varta-style = { path = "../varta-style" }
thiserror.workspace = true
# The host-owned permission decision file and audit log (already locked
# through varta-common and the runtime).
serde_json.workspace = true
# Windowing and CPU presentation; Apache-2.0 and MIT OR Apache-2.0 respectively.
winit.workspace = true
softbuffer.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
wgpu = { workspace = true, optional = true }
vello_gpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
# fontconfig for `--system-fonts` on Linux, optional elsewhere (the
# `fontconfig` feature); skrifa (already locked through the view) reads a
# fallback face's character map.
fontconfig = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true }

[dev-dependencies]
# Exercise the same safe live planner compiled by the patched platform adapter.
accesskit_consumer = "=0.39.2"
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig.workspace = true
skrifa.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
core-text.workspace = true
core-graphics.workspace = true
core-foundation.workspace = true

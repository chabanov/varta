[package]
name = "varta-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:vello_gpu", "dep:pollster"]

[[bin]]
name = "varta-preview"
path = "src/main.rs"

# The production native shell: a validated packaged artifact with its
# manifest grants, narrowed by an optional host ceiling.
[[bin]]
name = "varta-shell"
path = "src/bin/varta-shell.rs"

[[example]]
name = "gpu_probe"
required-features = ["gpu"]

[[example]]
name = "gpu_clip_probe"
required-features = ["gpu"]

[dependencies]
# Packaged artifacts are read and validated exactly as the launcher reads them.
varta-artifact = { path = "../varta-artifact" }
varta-common = { path = "../varta-common" }
varta-runtime = { path = "../varta-runtime" }
varta-view = { path = "../varta-view" }
thiserror.workspace = true
# Windowing and CPU presentation; Apache-2.0 and MIT OR Apache-2.0 respectively.
winit.workspace = true
softbuffer.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
wgpu = { workspace = true, optional = true }
vello_gpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
# Exercise the same safe live planner compiled by the patched platform adapter.
accesskit_consumer = "=0.39.2"
sha2.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-text.workspace = true
core-graphics.workspace = true

[package]
name = "varta-intrinsics-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The v38 guest intrinsic library: `varta-intrinsics` compiled to a core
# wasm32 module by `scripts/build-intrinsics.py` (profile `intrinsics`). The
# compiler embeds the checked-in result and links the functions a program uses
# into its guest module. On native targets this crate is empty.
[lib]
crate-type = ["cdylib"]

[dependencies]
varta-intrinsics = { path = "../varta-intrinsics" }
varta-bigint = { path = "../varta-bigint" }
# The value-layout core (result buffer, page size, v38 data limits).
varta-common = { path = "../varta-common", default-features = false }

# Local time and locale data (v38 `local_time`): bundled tzdata and ICU4X
# CLDR data, built only into the wasm32 library (the crate is empty on
# native targets, so native builds never compile the data).
[target.'cfg(target_arch = "wasm32")'.dependencies]
varta-intl = { path = "../varta-intl" }

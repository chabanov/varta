[package]
name = "varta-style"
version.workspace = true
edition.workspace = true
license.workspace = true

# The view style engine (`no_std` + `alloc`): stylesheet admission, the
# cascade, custom and registered properties, computed values and cascade
# budgets. The native renderer (`varta-view`) links it, and the browser host
# runs the same code compiled to wasm32 (`varta-style-wasm`, built by
# `scripts/build-view-engine.py`).
[dependencies]
varta-common = { path = "../varta-common", default-features = false, features = ["view"] }
# Packaged faces' metrics (`fonts`): the font tables, `no_std`.
read-fonts.workspace = true
# The portable binary64 functions `varta-common` computes with (the same
# locked version), so both hosts round font metrics to the same bits.
libm = "=0.2.16"

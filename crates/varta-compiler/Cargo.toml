[package]
name = "varta-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varta-bigint = { path = "../varta-bigint" }
varta-common = { path = "../varta-common" }
thiserror.workspace = true
# `wasmparser` enables `reencode`, used for fuel-profile instrumentation and
# to link the v38 intrinsic library (no new crate: wasm-encoder already
# depends on the locked wasmparser).
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmparser.workspace = true
swc_common = "26.0.0"
swc_ecma_parser = "46.1.2"
swc_ecma_ast = "29.0.0"
swc_ecma_visit = "=29.0.0"

[features]
# Test-only: exposes the K4.4 suspension lowering hook and frame test exports
# to other crates' tests (runtime admission). Production dependents never
# enable it, and it is inert unless a test enables the hook on its thread.
suspension-test-hook = []
# Test-only: emit every profile with the v38 code generator (`codegen_v2`) so
# the existing runtime suites run against it. Changes the bytes of earlier
# profiles; production dependents never enable it.
codegen-v2-all-profiles = []

[dev-dependencies]
# Suspension-foundation tests drive frames and the dispatcher directly.
wasmtime.workspace = true

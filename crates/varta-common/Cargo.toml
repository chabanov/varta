[package]
name = "varta-common"
version.workspace = true
edition.workspace = true
license.workspace = true

# `std` (default) builds every engine contract. Without it the crate is the
# `no_std` + `alloc` value-layout core (`abi`, `memory`, `value`, `limits`,
# `text`) that the linked intrinsic library builds against for wasm32.
[features]
default = ["std"]
std = ["thiserror/std", "dep:url", "dep:serde", "dep:serde_json"]

[dependencies]
url = { workspace = true, optional = true }
thiserror = { version = "2.0", default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[package]
name = "varta"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "varta"
path = "src/main.rs"

[dependencies]
varta-runtime = { path = "../varta-runtime" }
varta-project = { path = "../varta-project" }
clap = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }

[dev-dependencies]
varta-common = { path = "../varta-common" }

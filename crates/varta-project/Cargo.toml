[package]
name = "varta-project"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varta-artifact = { path = "../varta-artifact" }
varta-common = { path = "../varta-common" }
varta-compiler = { path = "../varta-compiler" }
varta-runtime = { path = "../varta-runtime" }
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
# Existing locked primitives for SRI of the generated trusted browser loader.
sha2.workspace = true
base64.workspace = true
# Reuse the locked HTTP stack for the local development host; no bespoke parser.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
# The shared KV value layer, whose texts the browser registry repeats.
varta-kv-codec = { path = "../varta-kv-codec" }

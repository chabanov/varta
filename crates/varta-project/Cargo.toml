[package]
name = "varta-project"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
varta-artifact = { path = "../varta-artifact" }
varta-common = { path = "../varta-common" }
varta-compiler = { path = "../varta-compiler" }
varta-runtime = { path = "../varta-runtime" }
# K8 T1: build-time Tailwind stylesheets from the project's entry CSS.
varta-tailwind = { path = "../varta-tailwind" }
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
# Existing locked primitives for SRI of the generated trusted browser loader.
sha2.workspace = true
base64.workspace = true
# Reuse the locked HTTP stack for the local development host; no bespoke parser.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["signal", "process", "io-util"] }

getrandom.workspace = true
subtle.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The shared KV value layer, whose texts the browser registry repeats.
varta-kv-codec = { path = "../varta-kv-codec" }
# Runs the checked-in wasm32 KV codec beside the native build of the same
# crate (`browser::kv_codec_tests`); already locked through varta-runtime.
wasmtime.workspace = true
# The shared view style engine and the native renderer, which the
# checked-in wasm32 view engine must agree with (`browser::view_engine_tests`).
varta-style = { path = "../varta-style" }
varta-view = { path = "../varta-view" }
# TLS delivery acceptance uses the already locked native HTTP primitives.
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

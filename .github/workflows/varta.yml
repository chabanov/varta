name: Varta CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Core libraries without project tooling or CLI
        run: cargo check -p varta-common -p varta-compiler -p varta-runtime -p varta-artifact --lib --locked
      - name: Independent execution runtime without source tooling
        run: cargo build -p varta-launcher --bin varta-runtime --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Workspace tests (includes CLI security and packaging regressions)
        run: cargo test --workspace --locked
      - name: Checked core compatibility baseline (known gaps remain separate)
        run: cargo run -p varta-conformance --locked -- --json

[workspace]
resolver = "2"
members = [
  "crates/varta-cli",
  "crates/varta-common",
  "crates/varta-runtime",
  "crates/varta-compiler",
]
default-members = ["crates/varta-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
wasmtime = { version = "48.0.5", default-features = false, features = ["runtime", "cranelift", "parallel-compilation"] }
wasmtime-wast = "48.0.5"
wasm-encoder = "0.241"
wasmparser = "0.241"
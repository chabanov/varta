[workspace]
resolver = "2"
members = [
  "crates/varta-cli",
  "crates/varta-launcher",
  "crates/varta-artifact",
  "crates/varta-common",
  "crates/varta-runtime",
  "crates/varta-compiler",
  "crates/varta-project",
  "crates/varta-conformance",
  "crates/varta-bigint",
  "crates/varta-intrinsics",
  "crates/varta-intrinsics-wasm",
  "crates/varta-kv-codec",
  "crates/varta-kv-codec-wasm",
  "crates/varta-style",
  "crates/varta-style-wasm",
  "crates/varta-view",
  "crates/varta-desktop",
  "crates/varta-tailwind",
]
default-members = ["crates/varta-cli", "crates/varta-launcher"]
exclude = [
    "vendor/parley",
    "vendor/harfrust",
    "vendor/accesskit_macos",
    "vendor/accesskit_consumer",
    "vendor/taffy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95.0"

[workspace.dependencies]
# Unicode normalization (`String.prototype.normalize`, v38) in the linked
# intrinsics: already locked through the vendored `parley`; `no_std` with
# the compiled ICU4X data, the same release as the text stack.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }
# CPU fallback for native view rendering, with no PNG or SIMD dependencies.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
# MIT OR Apache-2.0: the decoders of the native view renderer's packaged
# images (`varta_view::ImageSet`), the formats the browser draws for `img`.
# `png` is the image-rs PNG/APNG decoder in safe Rust (it forbids unsafe
# code; fdeflate and miniz_oxide are pure Rust). `image` supplies the
# image-rs JPEG (zune-jpeg), GIF, WebP (image-webp), BMP and ICO decoders and
# their animation compositing, with only those features: safe Rust, no C
# codecs (its AVIF decoder needs dav1d, so AVIF stays refused). `moxcms`
# converts ICC, cICP and gAMA/cHRM colour to sRGB as CSS Color 4 asks, in
# safe Rust without default features. Every decoder runs with the view
# image limits.
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
moxcms = { version = "=0.8.1", default-features = false }
# Font outlines for the CPU text renderer; already used transitively by Parley.
skrifa = "=0.44.0"
# The font tables the shared style engine reads its first available font's
# metrics from (CSS Values 4 §6.1.1); already locked as skrifa's own table
# reader. Its `no_std` build (the engine's wasm32 module has no `std`) needs
# its `libm` feature, which adds the one package `core_maths` (MIT, a float
# extension trait over the already locked `libm`).
read-fonts = { version = "=0.41.0", default-features = false, features = ["libm"] }
# Unicode grapheme boundaries for safe native text editing.
unicode-segmentation = "=1.13.3"
# Unicode emoji properties (TR51) for emoji presentation; already compiled in
# through Parley's shaping analysis.
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
# Native desktop window/input and CPU frame presentation.
winit = "=0.30.12"
# Safe CoreText/CoreGraphics wrappers for host-only native glyph coverage.
# v21 reuses the existing locked CoreGraphics 0.24/CoreFoundation 0.10 stack.
core-text = "=21.0.0"
core-graphics = "=0.24.0"
# The CoreFoundation types of that stack, named to read CoreGraphics's own
# variation-axis records and verify an instance; already locked through it.
core-foundation = "=0.10.1"
# MIT: safe wrapper over fontconfig for `varta-shell --system-fonts` on Linux,
# the library Chrome resolves generic families and character fallback with
# there. `dlopen` loads libfontconfig at run time (no link-time dependency,
# so cross builds need no fontconfig development files); its only new
# package is `yeslogic-fontconfig-sys`, the rest is already locked.
fontconfig = { version = "=0.11.0", features = ["dlopen"] }
# Already locked through winit and arboard: AppKit's preferred scroller style
# (`NSScroller.preferredScrollerStyle`), the system setting Chrome follows for
# overlay or always-shown scrollbars; a safe class method on the main thread.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSControl", "NSResponder", "NSScroller", "NSView", "NSWorkspace"] }
softbuffer = { version = "=0.4.6", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# Apache-2.0: semantic tree and native accessibility adapters, desktop only.
accesskit = "=0.25.2"
accesskit_winit = "=0.34.2"
# MIT OR Apache-2.0; text-only OS clipboard on a bounded desktop I/O worker.
# Wayland data-control is optional at runtime; no image codecs are enabled.
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
# Optional desktop GPU backend only; no GPU imports in the guest/runtime.
# MIT OR Apache-2.0; wgpu validates native graphics operations, Vello GPU draws
# the host-owned bounded 2D scene, pollster drives device initialization.
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "metal", "vulkan", "dx12", "wgsl"] }
vello_gpu = { version = "=0.3.0", default-features = false, features = ["wgpu"] }
pollster = "=0.4.0"
ryu-js = "=1.0.3"
# OS entropy for bounded Math.random samples; no guest seed or ambient file access.
getrandom = "=0.3.4"
# Already locked via the compiler; bounded exact intervals for numeric radix text.
num-bigint = "=0.4.8"
# `call-hook`: the v38 fair host fuel charge of every host import call.
# `async` and `pooling-allocator` (K7 H2): the native HTTP server runs each
# request as an async call on a fiber that yields on epochs and fuel, from a
# fixed pool of instance slots; both are features of the locked crate, and
# its fiber crate is already locked.
wasmtime = { version = "48.0.5", default-features = false, features = ["runtime", "cranelift", "parallel-compilation", "call-hook", "async", "pooling-allocator"] }
wasm-encoder = "0.241"
wasmparser = "0.241"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
ureq = { version = "=3.5.0", default-features = false }
url = "=2.5.8"
# Application identity of permission broker v1 (v38): the SHA-256 digest of
# the portable Wasm keys stored decisions until C3 provenance. Already locked
# through the conformance runner.
sha2 = "=0.10.9"
base64 = "=0.22.1"

# Server framing/timers use maintained HTTP and async I/O implementations.
# `http2` (K7 H3): the native server's HTTP/2 over TLS ALPN `h2`, from the
# HTTP library already in use (its `h2` crate, with the rapid-reset bounds).
hyper = { version = "=1.12.0", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
# `rt-multi-thread` (K7 H2): the native server's request tasks share a few
# worker threads, and a blocking host operation hands its thread's tasks on.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
# HTTPS for `net.request` (v37 `fetch`): rustls with the ring provider (no
# OpenSSL, no aws-lc C build) and the compiled-in Mozilla root set, so
# certificate trust never depends on an ambient system store.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"
# Deno KV file compatibility (v38 `kv`): the SQLite backend and protocol
# types of Deno KV at exactly the versions Deno 2.9.4 and 2.9.7 lock
# (denokv_sqlite/denokv_proto 0.14.0, rusqlite 0.40.1 over libsqlite3-sys
# 0.38.1 with bundled SQLite), so Varta opens the same files with the same
# engine. Host side only: `varta-runtime` is their one dependent.
denokv_sqlite = { version = "=0.14.0", default-features = false }
denokv_proto = "=0.14.0"
# `hooks` (also on in Deno through `session`): the commit hook that keeps a
# guest commit from reaching the file after its turn's commit cutoff.
rusqlite = { version = "=0.40.1", features = ["bundled", "fallible_uint", "hooks"] }
# The error type of the denokv connection factory and the versionstamp
# generator it takes (Deno's own `StdRng::from_entropy`); rand stays at its locked 0.8.8.
deno_error = "=0.7.1"
rand = "=0.8.8"
# `denokv_proto::Mutation::expire_at`; no clock feature (denokv's own rule).
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
# Test-only: certificates for the loopback HTTPS server of the runtime tests.
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }

# Debug and test builds optimize compute-heavy dependencies, keeping Varta
# engine code unoptimized with debug assertions. The Wasm code generator: validating or
# running a large guest module compiles it with Cranelift, which unoptimized
# takes seconds per module and let `build --single` launcher probes and
# wall-clock-bound tests race their deadlines under parallel test load.
# These profile overrides apply only to dev/test; guest limits are unchanged.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3

# CPU scan conversion performs millions of scalar/vector operations per frame.
# Keep the graphics primitives fast in dev without optimizing Varta's renderer,
# changing debug assertions, dependencies, guest fuel or native work ceilings.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3

# The window host packs millions of pixels for presentation while scrolling.
# Keep this loop vectorizable in debug; the view/compiler/runtime engine stays
# at opt-level 0, with all debug assertions enabled in the host too.
[profile.dev.package.varta-desktop]
opt-level = 3

[profile.dev.package.vello_gpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3

# The v38 guest intrinsic library (`scripts/build-intrinsics.py`): a size-
# optimized, abort-on-panic wasm32 build of `varta-intrinsics-wasm`. Only that
# script uses this profile; every native build keeps its own settings.
[profile.intrinsics]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Preserve complete Unicode runs/clusters: upstream 0.11.1 has narrow cluster
# offsets/counts and prefix-only font coverage. See vendor/parley/VARTA-PATCH.md.
[patch.crates-io]
parley = { path = "vendor/parley" }
# CoreText's character fallback (`CTFontCreateForStringWithLanguage`) as one
# safe wrapper, for the shell's platform fallback faces; see its patch record.
core-text = { path = "vendor/core-text" }
# Optional bounded shaping requests and explicit failure/accounting status.
harfrust = { path = "vendor/harfrust" }
# Coalesced live announcements with busy/atomic semantics; see its patch record.
accesskit_macos = { path = "vendor/accesskit_macos" }
# Clip-aware node_at_point for every platform adapter; see its patch record.
accesskit_consumer = { path = "vendor/accesskit_consumer" }
# A resolver for `calc()` handles in the high-level tree; see its patch record.
taffy = { path = "vendor/taffy" }
